name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR branch makes the run before it worthless, so cancel it.
# Runs on main deploy, so each gets its own group and is never cancelled or
# replaced by a later push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. A job that needs more asks for it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # e2e runs in the Playwright image for this exact version. Ask the app's
      # own Playwright, so a Playwright upgrade can never leave the image behind.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(pnpm --filter caribou-app exec playwright --version | sed -nE 's/^Version ([0-9][0-9A-Za-z.+-]*)$/\1/p')
          if [[ -z "$version" ]]; then
            echo "::error::Could not read the Playwright version of caribou-app; e2e has no image to run in."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate Litro routes + page manifest
        run: pnpm --filter caribou-app build
      - name: Compute affected filter
        id: affected
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "args=--filter ...[origin/${{ github.base_ref }}]" >> $GITHUB_OUTPUT
          else
            echo "args=-r" >> $GITHUB_OUTPUT
          fi
      - run: pnpm ${{ steps.affected.outputs.args }} typecheck
      - run: pnpm ${{ steps.affected.outputs.args }} lint
      - run: pnpm ${{ steps.affected.outputs.args }} test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: coverage, path: '**/coverage/**' }

  e2e:
    # The release PR only bumps versions and changelogs. Its merge to main
    # runs e2e again before deploy, so running it on the PR too buys nothing.
    # A skipped job still satisfies the required check. The repo check stops
    # a fork from skipping it by naming its branch the same.
    if: ${{ !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    # The image ships the browsers and their system packages, so the job skips
    # `playwright install --with-deps`. Its apt step once stalled for 36 min
    # on a slow Ubuntu mirror.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.checks.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Firefox refuses to start as root when HOME belongs to another user.
      # Set it here, not as job env, which the runner's own docker CLI reads too.
      - run: HOME=/root pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/caribou/playwright-report }

  changeset-check:
    # Skip on the bot-authored release PR, which legitimately consumes all
    # pending changesets — `changeset status` treats "packages changed but
    # no changesets" as a hard error, which is the whole point of that PR.
    if: github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main

  # Build the Docker image, run it, and probe it with the same checks
  # verify-prod runs against caribou.quest. Catches the "works in dev, 500s in
  # prod" class of bug that slipped through checks+e2e (which run with hoisted
  # node_modules) — e.g. a server module that does
  # `readFileSync(require.resolve('@workspace/pkg/file'))` at init works
  # locally but throws MODULE_NOT_FOUND in the runtime image, which ships only
  # `dist/`.
  #
  # On a push to main, the image that passed the probe is pushed to GHCR as
  # ghcr.io/<repo>:<sha>. Deploy tells Coolify to run that exact tag, so
  # production runs the bytes tested here, not a fresh build of whatever main
  # points at later. There is no moving tag such as :main or :latest: Coolify
  # keeps the last deployed SHA as its tag, so a manual redeploy in Coolify
  # runs the same tested image again.
  #
  # Skipped on the release PR for the same reason as e2e: main runs it again
  # before deploy, and deploy needs it.
  smoke-image:
    if: ${{ !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    permissions:
      contents: read
      # Only the push to main writes to GHCR; PR runs never log in.
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: docker/setup-buildx-action@v3
      - name: Build caribou-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/caribou/Dockerfile
          load: true
          tags: caribou-app:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --rm -p 3000:3000 --name caribou-smoke caribou-app:ci
      - name: Probe container
        env:
          CARIBOU_BASE_URL: http://localhost:3000
          CARIBOU_SKIP_SHA_ASSERT: '1'
          CARIBOU_PROBE_RETRIES: '15'
          CARIBOU_PROBE_DELAY_MS: '2000'
        run: node scripts/verify-prod.mjs
      - name: Container logs
        if: always()
        run: docker logs caribou-smoke || true
      - name: Stop container
        if: always()
        run: docker stop caribou-smoke || true
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the image the probe just passed, not a rebuild of it.
      - name: Push tested image
        id: publish
        if: env.PUBLISH == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag caribou-app:ci "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Deploy the image smoke-image pushed for this run's commit. Coolify runs a
  # "Docker Image" resource: this job sets its tag to github.sha, then starts
  # a deploy of that resource and waits for it to finish. Coolify never
  # builds from main, so a push that lands mid-deploy cannot slip in.
  #
  # Deploy only when this run's commit is still main's head. A newer push has
  # its own run, which deploys once that commit is tested; this stops an older
  # run from rolling production back. The group keeps two deploys from
  # overlapping.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e, smoke-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.head.outputs.current }}
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      IMAGE: ${{ needs.smoke-image.outputs.image }}
    steps:
      - name: Check deploy settings
        run: |
          missing=()
          [[ -n "$COOLIFY_API_URL" ]] || missing+=(COOLIFY_API_URL)
          [[ -n "$COOLIFY_API_TOKEN" ]] || missing+=(COOLIFY_API_TOKEN)
          [[ -n "$COOLIFY_APP_UUID" ]] || missing+=(COOLIFY_APP_UUID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secret(s): ${missing[*]}. Not deploying. See docs/deploy.md."
            exit 1
          fi
          if [[ "$IMAGE" != *":${GITHUB_SHA}" ]]; then
            echo "::error::smoke-image did not push an image for ${GITHUB_SHA} (got '${IMAGE}'). Not deploying."
            exit 1
          fi
      - name: Check main has not moved on
        id: head
        run: |
          # An unknown head is not "moved on": fail loudly instead of skipping green.
          if ! head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1) || [[ -z "$head" ]]; then
            echo "::error::Could not read the head of main from GitHub; not deploying."
            exit 1
          fi
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not ${GITHUB_SHA}. Skipping the deploy; the run for the newer commit deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Point Coolify at the tested image
        if: steps.head.outputs.current == 'true'
        run: |
          api="${COOLIFY_API_URL%/}"
          body=$(jq -nc --arg name "${IMAGE%:*}" --arg tag "$GITHUB_SHA" \
            '{docker_registry_image_name: $name, docker_registry_image_tag: $tag}')
          # Write the token to a header file so it never appears in argv.
          printf 'Authorization: Bearer %s\n' "$COOLIFY_API_TOKEN" > "$RUNNER_TEMP/auth"
          curl -fSsL -X PATCH -H @"$RUNNER_TEMP/auth" -H 'Content-Type: application/json' \
            --data "$body" "$api/applications/$COOLIFY_APP_UUID" > /dev/null
          # Read it back: a resource that is not a Docker Image app ignores the tag.
          tag=$(curl -fSsL -H @"$RUNNER_TEMP/auth" "$api/applications/$COOLIFY_APP_UUID" \
            | jq -r '"\(.build_pack) \(.docker_registry_image_tag)"')
          if [[ "$tag" != "dockerimage $GITHUB_SHA" ]]; then
            echo "::error::Coolify app is not a Docker Image resource on tag ${GITHUB_SHA} (got: $tag). Not deploying."
            exit 1
          fi
      - name: Deploy and wait
        if: steps.head.outputs.current == 'true'
        run: |
          api="${COOLIFY_API_URL%/}"
          deployment=$(curl -fSsL -X POST -H @"$RUNNER_TEMP/auth" \
            "$api/deploy?uuid=$COOLIFY_APP_UUID&force=false" | jq -r '.deployments[0].deployment_uuid // empty')
          if [[ -z "$deployment" ]]; then
            echo "::error::Coolify did not return a deployment id."
            exit 1
          fi
          echo "Coolify deployment $deployment for $IMAGE"
          # 60 x 10s = 10 minutes, inside the job's 15-minute limit.
          for _ in $(seq 60); do
            status=$(curl -fSsL -H @"$RUNNER_TEMP/auth" "$api/deployments/$deployment" | jq -r '.status') || status=unknown
            case "$status" in
              finished) echo "Deployed $IMAGE"; exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $deployment ended as $status."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Coolify deployment $deployment did not finish in 10 minutes (last status: $status)."
          exit 1
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/auth"

  verify-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe caribou.quest
        env:
          CARIBOU_BASE_URL: https://caribou.quest
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/verify-prod.mjs
